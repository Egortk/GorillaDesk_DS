name: Storybook on GitHub Pages

# Rebuilds Storybook from main and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://egortk.github.io/GorillaDesk_DS/.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: storybook-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook -w @gorilladesk/ui

      - name: Publish to gh-pages
        working-directory: packages/ui/storybook-static
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Storybook from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
