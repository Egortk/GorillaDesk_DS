name: Release

# On main: collect changesets into a "Version packages" PR; when that PR is merged, publish
# the packages to GitHub Packages and create git tags + GitHub releases.
# Packages marked "private": true are versioned and tagged but not published.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@gorilladesk'

      - run: npm ci

      - uses: changesets/action@v2.1.2
        with:
          version: npm run version-packages
          publish: npm run release
          title: 'Version packages'
          commit: 'Version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
