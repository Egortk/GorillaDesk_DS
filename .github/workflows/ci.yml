name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tokens, types, build, Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Rebuild tokens from raw/ and fail if the committed generated files differ (CLAUDE.md rule 10).
      - name: Tokens are up to date
        run: |
          npm run tokens -w @gorilladesk/tokens
          git diff --exit-code -- packages/tokens/tokens packages/tokens/dist

      - name: Typecheck
        run: npm run typecheck -w @gorilladesk/ui

      - name: Build package
        run: npm run build -w @gorilladesk/ui

      - name: Build Storybook
        run: npm run build-storybook -w @gorilladesk/ui

  chromatic:
    name: Chromatic visual tests
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # TurboSnap (onlyChanged) needs git history

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Skip without token
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: echo "::notice::CHROMATIC_PROJECT_TOKEN secret is not set; visual tests skipped."

      # Options (buildScriptName, onlyChanged, exitZeroOnChanges, zip) come from packages/ui/chromatic.config.json.
      - name: Run Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        uses: chromaui/action@v18.14.2
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          configFile: chromatic.config.json
